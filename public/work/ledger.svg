<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161412"/>
      <stop offset="1" stop-color="#2a1c14"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#g)"/>
  <g stroke="#d96a44" stroke-width="1.2" fill="none" opacity="0.55">
    <path d="M120 760 L300 540 L470 600 L640 360"/>
    <circle cx="120" cy="760" r="6" fill="#d96a44"/>
    <circle cx="300" cy="540" r="6" fill="#d96a44"/>
    <circle cx="470" cy="600" r="6" fill="#d96a44"/>
    <circle cx="640" cy="360" r="6" fill="#d96a44"/>
  </g>
  <g fill="#e8e6e1" opacity="0.06">
    <rect x="120" y="180" width="560" height="2"/>
    <rect x="120" y="240" width="420" height="2"/>
    <rect x="120" y="300" width="500" height="2"/>
  </g>
  <rect width="800" height="1000" filter="url(#grain)" opacity="0.5"/>
</svg>
