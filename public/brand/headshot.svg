<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" role="img" aria-labelledby="headshot-title" preserveAspectRatio="xMidYMid slice">
  <title id="headshot-title">Headshot placeholder — replace with headshot.jpg</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a38" />
      <stop offset="100%" stop-color="#1f1f1d" />
    </linearGradient>
    <radialGradient id="light" cx="40%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#9a9892" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9a9892" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="480" height="600" fill="url(#bg)" />
  <rect width="480" height="600" fill="url(#light)" />
  <!-- silhouette -->
  <ellipse cx="240" cy="240" rx="92" ry="110" fill="#0e0e0d" opacity="0.55" />
  <path d="M 90 600 C 90 470, 170 410, 240 410 C 310 410, 390 470, 390 600 Z" fill="#0e0e0d" opacity="0.55" />
  <text x="50%" y="94%" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif"
        font-size="11" letter-spacing="0.25em"
        text-transform="uppercase" fill="#a8a8a4">
    REPLACE WITH HEADSHOT.JPG
  </text>
</svg>
